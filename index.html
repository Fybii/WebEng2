<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />

  <!-- Mobile-first: kein automatisches Zoom durch den Browser -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PWA: App verhält sich wie eine native App auf dem Homescreen -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Navix" />
  <meta name="theme-color" content="#0f172a" />

  <meta name="description" content="Navix – Kartenbasierte PWA mit Geocoding, Wikipedia und Routing." />

  <!-- Schriften: Sora (Headlines/Marke) + DM Sans (UI/Text) -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <title>Navix – Navigation & Explore</title>
</head>
<body>
  <!-- React mountet hier die gesamte App -->
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
